<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>俄罗斯方块</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="app-title">俄罗斯方块</h1>
      <button class="btn btn-primary" id="restartBtn" type="button">重新开始</button>
    </header>

    <main class="card game">
      <div class="board-wrap">
        <canvas id="board" width="240" height="480" aria-label="俄罗斯方块游戏区"></canvas>
        <div class="overlay" id="overlay">
          <p class="overlay-title" id="overlayTitle">准备开始</p>
          <p class="overlay-text" id="overlayText">方向键移动，↑ 旋转，空格速降</p>
          <button class="btn btn-primary" id="startBtn" type="button">开始游戏</button>
        </div>
      </div>

      <aside class="panel">
        <div class="stat">
          <span class="stat-label">分数</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">消行</span>
          <span class="stat-value" id="lines">0</span>
        </div>
        <div class="stat stat-next">
          <span class="stat-label">下一个</span>
          <canvas id="next" width="96" height="96" aria-label="下一个方块"></canvas>
        </div>
        <div class="hints">
          <p class="hint-title">操作说明</p>
          <p class="hint">← → / A D：左右移动</p>
          <p class="hint">↓ / S：加速下落</p>
          <p class="hint">↑ / W：顺时针旋转</p>
          <p class="hint">空格：直接落下</p>
        </div>
      </aside>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
