<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网页应用生成智能体</title>
    <!--
      首屏主题预设：在样式与脚本加载前读出本机主题偏好并在 <html> 上打标，
      使首屏即以最终主题呈现，避免「先浅色后突变」的闪白（见 design.md 决策 5）。
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('code-assistant.theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : null;
          var dark = mode
            ? mode === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (err) {
          /* 隐私模式下读不到偏好，退回浅色，不影响后续使用 */
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      /* 与 antd 的 colorBgLayout 对齐，避免 React 挂载前的底色跳变 */
      html[data-theme='dark'] { background-color: #000000; }
      html[data-theme='light'] { background-color: #f5f5f5; }
      html, body { margin: 0; }
    </style>
    <script type="module" crossorigin src="/assets/index-BKHYLswn.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BzZ7e5T9.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
