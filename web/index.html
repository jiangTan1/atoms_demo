<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>代码辅助智能体</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div class="auth" id="auth-app">
    <div class="auth-card">
      <div class="auth-head">
        <span class="brand-title">代码辅助智能体</span>
        <span class="brand-sub">代码生成 · 代码解释 · 重构优化 · 缺陷排查</span>
      </div>

      <div class="auth-modes">
        <button id="auth-mode-login" type="button" class="ghost active">登录</button>
        <button id="auth-mode-register" type="button" class="ghost">注册</button>
        <button id="auth-mode-password" type="button" class="ghost">修改密码</button>
      </div>

      <form id="auth-form" class="auth-form">
        <label class="field" for="auth-username">
          <span>用户名</span>
          <input id="auth-username" type="text" maxlength="20" autocomplete="username"
                 placeholder="3 到 20 个字符" />
        </label>
        <label class="field" for="auth-password">
          <span>密码</span>
          <input id="auth-password" type="password" maxlength="20"
                 autocomplete="current-password" />
        </label>
        <div class="auth-actions">
          <button id="auth-submit" type="submit" class="primary">登录</button>
          <button id="auth-cancel" type="button" class="ghost">取消</button>
        </div>
      </form>

      <p id="auth-tip" class="auth-tip" role="status"></p>
    </div>
  </div>

  <div class="app" id="chat-app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-title">代码辅助智能体</span>
        <span class="brand-sub">代码生成 · 代码解释 · 重构优化 · 缺陷排查</span>
      </div>
      <div class="controls">
        <label class="field">
          <span>目标语言</span>
          <select id="language">
            <option value="">自动推断</option>
            <option value="java">Java</option>
            <option value="python">Python</option>
            <option value="csharp">C#</option>
            <option value="cpp">C++</option>
            <option value="html">HTML</option>
            <option value="javascript">JavaScript</option>
          </select>
        </label>
        <button id="history-toggle" type="button" class="ghost"
                aria-expanded="false" aria-controls="history-panel">历史会话</button>
        <button id="new-session" type="button" class="ghost">新建会话</button>
        <button id="download-project" type="button" class="ghost"
                title="把当前会话生成的全部文件打包下载">下载整个项目</button>
        <span id="session-id" class="session-id" title="当前还没有会话 ID">新会话（尚未创建）</span>
        <span id="current-user" class="user-chip" title="当前登录用户"></span>
        <button id="change-password" type="button" class="ghost">修改密码</button>
        <button id="logout" type="button" class="ghost">退出登录</button>
      </div>

      <div id="history-panel" class="history-panel" hidden>
        <div class="history-head">
          <span>历史会话</span>
          <button id="history-refresh" type="button" class="code-copy">刷新</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite">
      <div class="empty" id="empty-hint">
        <p>描述你要实现的功能、粘贴一段待解释或待重构的代码、或贴上代码让助手排查问题。</p>
        <p class="hint">示例：用 Java 写一个线程安全的单例；解释这段 Python 的装饰器；这段 C# 代码有什么 bug。</p>
      </div>
    </main>

    <footer class="composer">
      <textarea id="input" rows="3" placeholder="输入问题，Ctrl + Enter 发送"></textarea>
      <div class="composer-actions">
        <span id="status" class="status"></span>
        <button id="send" type="button" class="primary">发送</button>
      </div>
    </footer>
  </div>

  <div class="modal" id="password-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="password-modal-title">
      <span class="brand-title" id="password-modal-title">修改密码</span>
      <p class="modal-note" id="password-modal-user"></p>
      <form id="password-form" class="auth-form">
        <label class="field" for="password-old">
          <span>原密码</span>
          <input id="password-old" type="password" maxlength="20" autocomplete="current-password" />
        </label>
        <label class="field" for="password-new">
          <span>新密码</span>
          <input id="password-new" type="password" maxlength="20" autocomplete="new-password"
                 placeholder="3 到 20 个字符" />
        </label>
        <div class="auth-actions">
          <button id="password-submit" type="submit" class="primary">确认修改</button>
          <button id="password-cancel" type="button" class="ghost">取消</button>
        </div>
      </form>
      <p id="password-tip" class="auth-tip" role="status"></p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
