# 网页应用生成智能体：Nginx 反向代理样例（单机部署，适用于阿里云 ECS）
#
# 放置位置：/etc/nginx/conf.d/code-assistant.conf
# conf.d 下的文件会被 include 进 http 块，因此下面的 limit_req_zone 可以生效。
#
# 启用前需要替换：server_name、证书路径。
# 后端地址必须与 deploy/code-assistant.service 的 ExecStart 保持一致（127.0.0.1:80）。
#
# 注意：应用现在占用 80（仅绑定 127.0.0.1），因此本样例不再监听 80，只保留 443。
# 若要用 80 做 HTTP→HTTPS 跳转或 ACME webroot 校验，需要把 80 让给 Nginx：
# 同时把 `APP_PORT`（或 systemd 的 ExecStart）改成别的端口，二者不能同时占用 80。
# 证书可用 DNS-01 方式签发，或在签发/续期时临时停掉应用（systemctl stop code-assistant）。

# 登录之外的第二道防线：按来源 IP 限制提问频率，避免单个账号把模型额度刷满
limit_req_zone $binary_remote_addr zone=code_assistant_chat:10m rate=20r/m;

# 分享预览是唯一免登录的读入口，按来源 IP 限流以缓解 token 枚举与流量滥用
limit_req_zone $binary_remote_addr zone=code_assistant_share:10m rate=60r/m;

# 应用已占用 80（127.0.0.1），这里不再监听 80，避免与之冲突；HTTP 入口按需自行加回。
# 如需 HTTP→HTTPS 跳转与 ACME webroot 校验，参考文件头的说明调整端口分配。
# server {
#     listen 80;
#     server_name your-domain.example.com;
#
#     location /.well-known/acme-challenge/ {
#         root /var/www/html;
#     }
#
#     location / {
#         return 301 https://$host$request_uri;
#     }
# }

server {
    listen 443 ssl;
    server_name your-domain.example.com;

    # 阿里云可申请免费 DV 证书，下载 Nginx 版后放到这两个路径
    ssl_certificate     /etc/nginx/ssl/your-domain.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 对话接口：流式返回，必须关闭缓冲
    location /api/chat {
        limit_req zone=code_assistant_chat burst=3 nodelay;

        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 关键：不关缓冲的话，流式回复会被 Nginx 攒完再一次性吐出，
        # 页面上就没有逐字出现的打字机效果了。
        # 应用侧另外会发 X-Accel-Buffering: no，这里再显式关一次更稳妥。
        proxy_buffering off;

        # 单轮回复实测 20-30s，长代码可能更久；默认 60s 会被提前切断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 免登录的分享预览：按来源 IP 限流，避免被批量枚举 token 或当作免费静态托管刷流量
    location /share/ {
        limit_req zone=code_assistant_share burst=20 nodelay;

        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态前端与会话接口，无需特殊处理
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}