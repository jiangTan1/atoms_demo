# 代码辅助智能体：Nginx 反向代理样例（单机部署，适用于阿里云 ECS）
#
# 放置位置：/etc/nginx/conf.d/code-assistant.conf
# conf.d 下的文件会被 include 进 http 块，因此下面的 limit_req_zone 可以生效。
#
# 启用前需要替换：server_name、证书路径。
# 后端地址必须与 deploy/code-assistant.service 的 ExecStart 保持一致（127.0.0.1:8000）。

# 接口没有鉴权，按来源 IP 限制提问频率，避免模型额度被刷
limit_req_zone $binary_remote_addr zone=code_assistant_chat:10m rate=20r/m;

server {
    listen 80;
    server_name your-domain.example.com;

    # 签发/续期证书时的 webroot 校验路径，申请证书期间需要保留
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
    # 还没有证书、想先用 IP + HTTP 试跑时，把上面这条换成与下面 443 段相同的 proxy_pass 配置
}

server {
    listen 443 ssl;
    server_name your-domain.example.com;

    # 阿里云可申请免费 DV 证书，下载 Nginx 版后放到这两个路径
    ssl_certificate     /etc/nginx/ssl/your-domain.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 对话接口：流式返回，必须关闭缓冲
    location /api/chat {
        limit_req zone=code_assistant_chat burst=3 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 关键：不关缓冲的话，流式回复会被 Nginx 攒完再一次性吐出，
        # 页面上就没有逐字出现的打字机效果了。
        # 应用侧另外会发 X-Accel-Buffering: no，这里再显式关一次更稳妥。
        proxy_buffering off;

        # 单轮回复实测 20-30s，长代码可能更久；默认 60s 会被提前切断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态前端与会话接口，无需特殊处理
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}